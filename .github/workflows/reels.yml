# The daily Reels (Thomas, 2026-11-20: "1 explainer and 1 satisfying and 1
# ad per day"). Each format runs `npx social reel <format>`: idea, script,
# video and the pre-publish checks, each behind its gate
# (src/pipeline/reel.ts). A Reel that passes every check goes out on its own
# as a Trial Reel only: non-followers see it, and sharing it with followers
# stays Thomas's call in the Instagram app (CLAUDE.md). Anything that fails a
# gate stops that Reel for the day; nothing is retried.
#
# Run it by hand from the Actions tab with "post" off to make and check the
# Reels without posting them.
name: Daily Reels

on:
  workflow_dispatch:
    inputs:
      format:
        description: Which Reel to make (all makes the three daily ones)
        type: choice
        default: all
        options: [all, explainer, satisfying, ad]
      post:
        description: Post it as a Trial Reel when every check passes (off makes and checks it only)
        type: boolean
        default: false

# Its own group, so the hourly Hitta and posting runs in social.yml never wait on a Reel.
concurrency:
  group: reels
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # One at a time: they post about half an hour apart and share the Claude limits.
      max-parallel: 1
      fail-fast: false
      matrix:
        format: ${{ fromJSON((github.event_name != 'schedule' && inputs.format != 'all') && format('["{0}"]', inputs.format) || '["explainer","satisfying","ad"]') }}
    env:
      VAULT_DATABASE_URL: ${{ secrets.VAULT_DATABASE_URL }}
      VAULT_DATABASE_AUTH_TOKEN: ${{ secrets.VAULT_DATABASE_AUTH_TOKEN }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      HITTA_API_KEY: ${{ secrets.HITTA_API_KEY }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      INSTAGRAM_GRAPH_HOST: ${{ vars.INSTAGRAM_GRAPH_HOST }}
      FACEBOOK_PAGE_ID: ${{ vars.FACEBOOK_PAGE_ID }}
      META_APP_ID: ${{ vars.META_APP_ID }}
      META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_NARRATOR_VOICE: ${{ vars.ELEVENLABS_NARRATOR_VOICE }}
      RESEARCH_ACCOUNTS: ${{ vars.RESEARCH_ACCOUNTS }}
      REEL_FORMAT: ${{ matrix.format }}
      # Scheduled runs post; a run by hand posts only when asked.
      REEL_POST: ${{ (github.event_name == 'schedule' || inputs.post) && 'on' || 'off' }}
    steps:
      - uses: actions/checkout@v5

      - name: Clean up pasted secrets
        run: |
          for name in VAULT_DATABASE_URL VAULT_DATABASE_AUTH_TOKEN CLAUDE_CODE_OAUTH_TOKEN HITTA_API_KEY INSTAGRAM_ACCESS_TOKEN INSTAGRAM_USER_ID META_APP_SECRET ELEVENLABS_API_KEY; do
            value="$(printf '%s' "${!name}" | tr -d '[:space:]')"
            [ -n "$value" ] && echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      # First, before anything long: Hitta waits on the phone for these
      # answers (CLAUDE.md). A failure here never stops the Reel.
      - name: Answer Hitta's requests
        continue-on-error: true
        run: npx social requests

      - name: Check ffmpeg
        run: command -v ffprobe >/dev/null && command -v ffmpeg >/dev/null || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/align/requirements.txt

      # WhisperX times the narrator's words; without it stage 5 uses the speech service's stamps.
      - name: Install WhisperX
        continue-on-error: true
        run: |
          pip install --quiet -r pipeline/align/requirements.txt
          python -m nltk.downloader -q punkt_tab

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: social reel ${{ matrix.format }}
        id: reel
        run: npx social reel "$REEL_FORMAT"

      # The Reel and what the judge saw, posted or not, so Thomas can watch it.
      - name: Keep the Reel
        if: always() && steps.reel.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ matrix.format }}
          path: |
            reel/reel.mp4
            reel/timeline.json
            reel/motion.json
            reel/physics.json
            reel/judge/
            reel/follow/
          if-no-files-found: ignore
