# Five Reels a day (Thomas, 2026-11-21: "I want the AI to post 5 times a day
# with variety of content. It can start doing so without my approval. I am
# lifting that gate."). Each scheduled run makes the Reel of its slot
# (DAILY_SLOTS in src/pipeline/reel.ts: 7am explainer, 10am satisfying, 1pm
# ad, 4pm explainer, 7pm satisfying, Arizona time) with `npx social reel
# slot`: idea, script, video and the pre-publish checks, each behind its gate.
# A Reel that passes every check goes out on its own as a normal Reel, then to
# the Facebook Page (CLAUDE.md). Anything that fails a gate stops that slot's
# Reel; nothing is retried. Pausing the specialist on the Vault page stops it.
#
# Run it by hand from the Actions tab with "post" off to make and check the
# Reels without posting them.
name: Daily Reels

on:
  schedule:
    # A few minutes past 7, 10, 13, 16 and 19 in Arizona (UTC-7 all year), at
    # :03, away from the other employees' runs. The run takes about half an hour.
    - cron: "3 14 * * *"
    - cron: "3 17 * * *"
    - cron: "3 20 * * *"
    - cron: "3 23 * * *"
    - cron: "3 2 * * *"
  workflow_dispatch:
    inputs:
      format:
        description: Which Reel to make (all makes the three daily ones)
        type: choice
        default: all
        options: [all, explainer, satisfying, ad]
      post:
        description: Post it when every check passes (off makes and checks it only)
        type: boolean
        default: false
      product:
        description: An ad for this product (its name on the website); empty takes turns
        type: string
        default: ""

# Its own group, so the hourly Hitta and posting runs in social.yml never wait on a Reel.
concurrency:
  group: reels
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # One at a time: they share the Claude limits.
      max-parallel: 1
      fail-fast: false
      matrix:
        # A scheduled run makes its slot's format; by hand, the one asked for or all three.
        format: ${{ fromJSON(github.event_name == 'schedule' && '["slot"]' || (inputs.format != 'all' && format('["{0}"]', inputs.format) || '["explainer","satisfying","ad"]')) }}
    env:
      VAULT_DATABASE_URL: ${{ secrets.VAULT_DATABASE_URL }}
      VAULT_DATABASE_AUTH_TOKEN: ${{ secrets.VAULT_DATABASE_AUTH_TOKEN }}
      SOCIAL_SEAL_KEY: ${{ secrets.SOCIAL_SEAL_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      HITTA_API_KEY: ${{ secrets.HITTA_API_KEY }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      INSTAGRAM_GRAPH_HOST: ${{ vars.INSTAGRAM_GRAPH_HOST }}
      FACEBOOK_PAGE_ID: ${{ vars.FACEBOOK_PAGE_ID }}
      FACEBOOK_CROSSPOST: ${{ vars.FACEBOOK_CROSSPOST }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_CROSSPOST: ${{ vars.YOUTUBE_CROSSPOST }}
      META_APP_ID: ${{ vars.META_APP_ID }}
      META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_NARRATOR_VOICE: ${{ vars.ELEVENLABS_NARRATOR_VOICE }}
      RESEARCH_ACCOUNTS: ${{ vars.RESEARCH_ACCOUNTS }}
      REEL_FORMAT: ${{ matrix.format }}
      REEL_PRODUCT: ${{ inputs.product }}
      # Scheduled runs post; a run by hand posts only when asked.
      REEL_POST: ${{ (github.event_name == 'schedule' || inputs.post) && 'on' || 'off' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Clean up pasted secrets
        run: |
          for name in VAULT_DATABASE_URL VAULT_DATABASE_AUTH_TOKEN SOCIAL_SEAL_KEY CLAUDE_CODE_OAUTH_TOKEN HITTA_API_KEY INSTAGRAM_ACCESS_TOKEN INSTAGRAM_USER_ID META_APP_SECRET YOUTUBE_CLIENT_ID YOUTUBE_CLIENT_SECRET YOUTUBE_REFRESH_TOKEN ELEVENLABS_API_KEY; do
            value="$(printf '%s' "${!name}" | tr -d '[:space:]')"
            [ -n "$value" ] && echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # Installs run other people's code: none of the secrets, no install scripts (security check, 2026-11-21).
      - run: env -i PATH="$PATH" HOME="$HOME" npm ci --ignore-scripts

      - name: Install Claude Code
        run: env -i PATH="$PATH" HOME="$HOME" npm install -g @anthropic-ai/claude-code@2.1.330

      # First, before anything long: Hitta waits on the phone for these
      # answers (CLAUDE.md). A failure here never stops the Reel.
      - name: Answer Hitta's requests
        continue-on-error: true
        run: npx social requests

      - name: Check ffmpeg
        run: command -v ffprobe >/dev/null && command -v ffmpeg >/dev/null || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/align/requirements.txt

      # WhisperX times the narrator's words; without it stage 5 uses the speech service's stamps.
      - name: Install WhisperX
        continue-on-error: true
        run: |
          env -i PATH="$PATH" HOME="$HOME" pip install --quiet -r pipeline/align/requirements.txt
          env -i PATH="$PATH" HOME="$HOME" python -m nltk.downloader -q punkt_tab

      - name: Install the browser
        run: env -i PATH="$PATH" HOME="$HOME" npx playwright install --with-deps chromium

      - name: social reel ${{ matrix.format }}
        id: reel
        run: npx social reel "$REEL_FORMAT"

      # The Reel and what the judge saw, posted or not, so Thomas can watch it.
      - name: Keep the Reel
        if: always() && steps.reel.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reel-${{ matrix.format }}
          path: |
            reel/reel.mp4
            reel/script.json
            reel/timeline.json
            reel/motion.json
            reel/physics.json
            reel/judge/
            reel/follow/
          if-no-files-found: ignore
